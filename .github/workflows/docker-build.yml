name: docker-build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # needed to push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build once and load locally so we test the EXACT image we publish.
      - name: Build image (load for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: agentic-blueteam:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker run --rm agentic-blueteam:ci bash /opt/agentic-blueteam/tests/smoke-test.sh

      # Publish only on pushes to main (not PRs); pushes the tested image as-is.
      # The GHCR package is created PRIVATE by default (it inherits the private repo / GITHUB_TOKEN scope);
      # leave its visibility Private in the repo's Packages settings.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & push to GHCR (private)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # GHCR image names must be lowercase.
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="${GITHUB_SHA::7}"
          docker tag agentic-blueteam:ci "$IMAGE:latest"
          docker tag agentic-blueteam:ci "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHA_TAG"
          echo "Published $IMAGE:latest and $IMAGE:$SHA_TAG (visibility: Private)"
